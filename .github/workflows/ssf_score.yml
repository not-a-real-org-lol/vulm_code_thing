name: openSSF scoreboard

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions: read-all

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - name: Scorecard
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go install github.com/ossf/scorecard/v5@c395761df6afe1a69e476bc60a013a94bcbc153f
          "$(go env GOPATH)/bin/scorecard" \
            --repo=github.com/${{ github.repository }} \
            --format=json \
            --output=openSSF_scoreboard.json
          test -s openSSF_scoreboard.json || { echo "results.json is empty"; exit 1; }

      - name: Upload openSSF sarif scan to security
        if: always()
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-results
          path: openSSF_scoreboard.json
          retention-days: 14
