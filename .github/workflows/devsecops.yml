name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions: read-all

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image and export tar archive
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image tar artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-image
          path: /tmp/image.tar
          retention-days: 1

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies and pytest
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Execute unit tests
        env:
          STORAGE_DIR: "/tmp/scan_test"
        run: |
          pytest tests/ -v --tb=short

  security-scan:
    name: Vulnerability Security Gate (Trivy)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Trivy Repo & Misconfiguration Scan
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Download image tar artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: container-image
          path: /tmp

      - name: Run Trivy Security Gate
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # master
        with:
          input: /tmp/image.tar
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # master
        with:
          input: /tmp/image.tar
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload SARIF report to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  sbom:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Download image tar artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: container-image
          path: /tmp

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Generate CycloneDX JSON SBOM
        env:
          SYFT_FILE_METADATA_SELECTION: "none"
        run: |
          syft /tmp/image.tar \
            --source-name "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" \
            --source-version "${{ github.sha }}" \
            -o cyclonedx-json=sbom.cdx.json

      - name: Upload SBOM as CI Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom.cdx.json
          path: sbom.cdx.json
          retention-days: 14

  grype:
    name: Scan it with grype
    runs-on: ubuntu-latest
    needs: sbom
    permissions:
      contents: read
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom.cdx.json
          path: .

      - name: Scan SBOM with Trivy
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # master
        with:
          scan-type: 'sbom'
          scan-ref: 'sbom.cdx.json'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@1638637db639e0ade3258b51db49a9a137574c3e # v6

      - name: Scan
        run: |
          ${{ steps.grype.outputs.cmd }} sbom:sbom.cdx.json \
            --fail-on high \
            --only-fixed \
            -o table \
            -o sarif=grype.sarif

      - name: Upload report as CI Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grype.sarif
          path: grype.sarif
          retention-days: 14

      - name: Upload Grype SARIF report to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          sarif_file: 'grype.sarif'
          category: 'grype-sbom-scan'
        continue-on-error: true

  publish:
    name: Publish to Container Registry
    runs-on: ubuntu-latest
    needs: [security-scan, sbom, grype]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.push.outputs.image_tag }}
      image_digest: ${{ steps.push.outputs.image_digest }}
    steps:
      - name: Download image tar artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: container-image
          path: /tmp

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load image to local Docker daemon
        run: |
          docker load -i /tmp/image.tar

      - name: Tag and push container image
        id: push
        run: |
          TARGET_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAG_SHA="${TARGET_IMAGE}:${{ github.sha }}"
          TAG_LATEST="${TARGET_IMAGE}:latest"
          
          docker tag "${TAG_SHA}" "${TAG_LATEST}"
          docker push "${TAG_SHA}"
          docker push "${TAG_LATEST}"
          
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${TAG_SHA}")
          echo "image_tag=${TAG_SHA}" >> $GITHUB_OUTPUT
          echo "image_digest=${DIGEST}" >> $GITHUB_OUTPUT

  sign:
    name: Cryptographic Sign & Attest (Cosign)
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Install Cosign CLI
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
 
      - name: Download SBOM Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom.cdx.json
          path: ./
 
      - name: Log in to GHCR for Cosign
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Sign Image (Keyless OIDC)
        env:
          DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          cosign sign --yes "${DIGEST}"
 
      - name: Attest CycloneDX SBOM to Container Image
        env:
          DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          cosign attest --yes --predicate sbom.cdx.json --type cyclonedx "${DIGEST}"
 
      - name: Verify Cosign Signature and Attestation
        env:
          DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${DIGEST}"
 
          cosign verify-attestation --type cyclonedx \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${DIGEST}" > /dev/null


  release:
    name: Automatic release
    runs-on: ubuntu-latest
    needs: [publish, sign]
    # only adds a release on merge from PR, ot it should at least
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' 
    permissions:
      contents: write
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom.cdx.json
          path: ./release

      - name: Download Grype report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: grype.sarif
          path: ./release

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          TAG="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"

          cat > notes.md <<EOF
          ## Signed container image
          \`${IMAGE_DIGEST}\`

          ## Verify it
          \`\`\`
          cosign verify \\
            --certificate-identity-regexp ".*github.com/${GITHUB_REPOSITORY}.*" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            ${IMAGE_DIGEST}
          \`\`\`
          EOF

          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --notes-file notes.md \
            --generate-notes \
            release/sbom.cdx.json \
            release/grype.sarif